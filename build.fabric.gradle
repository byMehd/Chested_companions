plugins { id 'net.fabricmc.fabric-loom-remap' version '1.14.10' }
apply from: rootProject.file('build-common.gradle')
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // Only the standalone resource module is needed. Bundle it so users need no full Fabric API.
    modImplementation 'net.fabricmc.fabric-api:fabric-resource-loader-v1:1.0.10+78c8b46653'
    include 'net.fabricmc.fabric-api:fabric-resource-loader-v1:1.0.10+78c8b46653'
    include 'net.fabricmc.fabric-api:fabric-api-base:1.0.5+4ebb5c0853'
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    if (project.hasProperty('withOptionalMods')) {
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
        modRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
        modRuntimeOnly 'maven.modrinth:HKKqmr2p:TeC02EN7' // More Chest Variants 1.5.14
        modRuntimeOnly 'maven.modrinth:7jzrCiK0:TU9uupLI' // Quad 1.2.15
    }
}
sourceSets {
    smoke {
        java.setSrcDirs([rootProject.file('src/smoke/java')])
        resources.setSrcDirs([rootProject.file('src/smoke/resources')])
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        chestedcompanions_revived { sourceSet sourceSets.main }
        revived_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        client { runDir '../../run/fabric' }
        server { runDir '../../run/fabric-server' }
        smokeClient {
            client()
            source sourceSets.smoke
            runDir '../../run/smoke-fabric'
            vmArg '-Drevived.smoke=true'
        }
        smokeServer {
            server()
            source sourceSets.smoke
            runDir '../../run/smoke-fabric-server'
            vmArg '-Drevived.smoke.server=true'
            programArg '--nogui'
        }
    }
}
// A throw-away flat world with no mob spawning, so the scenarios play out on a quiet, predictable ground.
tasks.matching { it.name == 'runSmokeServer' }.configureEach {
    doFirst {
        def runDirectory = rootProject.file('run/smoke-fabric-server')
        runDirectory.mkdirs()
        new File(runDirectory, 'eula.txt').text = 'eula=true' + System.lineSeparator()
        new File(runDirectory, 'server.properties').text = [
                'level-type=minecraft:flat', 'online-mode=false', 'spawn-monsters=false', 'spawn-animals=false',
                'spawn-npcs=false', 'view-distance=4', 'simulation-distance=4', 'max-tick-time=-1',
                'pause-when-empty-seconds=-1'
        ].join(System.lineSeparator()) + System.lineSeparator()
        project.delete(new File(runDirectory, 'world'))
    }
}

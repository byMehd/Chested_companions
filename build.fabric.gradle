plugins { id 'net.fabricmc.fabric-loom-remap' version '1.14.10' }
apply from: rootProject.file('build-common.gradle')
apply from: rootProject.file('build-fabric-common.gradle')
loom { createRemapConfigurations(sourceSets.smoke) }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    // Only the modules that load the mod's own resources are needed; they are bundled so users need no full Fabric API.
    bundledModules.each { module, version ->
        modImplementation "net.fabricmc.fabric-api:${module}:${version}"
        include "net.fabricmc.fabric-api:${module}:${version}"
    }
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modSmokeCompileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    if (project.hasProperty('withGameTest') && !project.hasProperty('withOptionalMods')) {
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
    if (project.hasProperty('withOptionalMods')) {
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
        modRuntimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
        modRuntimeOnly "maven.modrinth:HKKqmr2p:${mcv_fabric_version}" // More Chest Variants 1.5.14
        modRuntimeOnly "maven.modrinth:7jzrCiK0:${quad_fabric_version}" // Quad
    }
}

plugins { id 'net.neoforged.moddev' version '2.0.148' }
apply from: rootProject.file('build-common.gradle')
neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = rootProject.file('run/neoforge') }
        server { server(); gameDirectory = rootProject.file('run/neoforge-server'); programArgument '--nogui' }
    }
    mods { chestedcompanions_revived { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.chestedcompanions_revived
    }
}
dependencies {
    testImplementation "net.neoforged:testframework:${neo_version}"
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    if (project.hasProperty('withOptionalMods')) {
        runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
        runtimeOnly 'maven.modrinth:HKKqmr2p:6UmR3cPp'
        runtimeOnly 'maven.modrinth:7jzrCiK0:yCBebvg9'
    }
}
sourceSets.test.java.srcDir rootProject.file('loaders/neoforge/src/test/java')

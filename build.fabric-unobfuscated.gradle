// Minecraft 26 is not obfuscated: Loom neither remaps the game nor the mods, so there are no mappings and no mod* configurations.
plugins { id 'net.fabricmc.fabric-loom' version '1.19.3' }
apply from: rootProject.file('build-common.gradle')
apply from: rootProject.file('build-fabric-common.gradle')
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    // Only the modules that load the mod's own resources are needed; they are bundled so users need no full Fabric API.
    bundledModules.each { module, version ->
        implementation "net.fabricmc.fabric-api:${module}:${version}"
        include "net.fabricmc.fabric-api:${module}:${version}"
    }
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    smokeCompileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    if (project.hasProperty('withFatCat')) {
        runtimeOnly files(rootProject.fileTree("research/fatcat-dependencies/${minecraft_version}") { include '*.jar' })
    }
    if (project.hasProperty('withGameTest') && !project.hasProperty('withOptionalMods')) {
        runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
    if (project.hasProperty('withOptionalMods')) {
        runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
        runtimeOnly "com.terraformersmc:modmenu:${modmenu_version}"
        if (mcv_fabric_version) {
            runtimeOnly "maven.modrinth:HKKqmr2p:${mcv_fabric_version}" // More Chest Variants, when published for this game version
            runtimeOnly "maven.modrinth:7jzrCiK0:${quad_fabric_version}" // Quad
        }
    }
}

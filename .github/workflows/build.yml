name: Minecraft 1.21.11 - build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.loader }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
        profile: [minimum, current]
    steps:
      - uses: actions/checkout@v7
      - name: Install game JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run unit tests
        shell: bash
        run: |
          chmod +x gradlew
          overrides=()
          if [[ '${{ matrix.profile }}' == minimum ]]; then
            case '${{ matrix.loader }}' in
              fabric) overrides+=(-Pfabric_loader_version=0.17.3) ;;
              neoforge) overrides+=(-Pneo_version=21.11.0-beta) ;;
              forge) overrides+=(-Pforge_version=61.0.1) ;;
            esac
          fi
          ./gradlew ':1.21.11-${{ matrix.loader }}:build' --stacktrace --console=plain \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 "${overrides[@]}"
          python3 scripts/verify_artifact.py '${{ matrix.loader }}'
      - name: Verify NeoForge with More Chest Variants
        if: matrix.loader == 'neoforge' && matrix.profile == 'current'
        run: ./gradlew :1.21.11-neoforge:test -PwithOptionalMods --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Start real Forge GameTest server
        if: matrix.loader == 'forge' && matrix.profile == 'current'
        run: ./gradlew :1.21.11-forge:runGameTestServer --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Upload installable JAR and sources
        if: matrix.profile == 'current'
        uses: actions/upload-artifact@v7
        with:
          name: Chested-Companions-Revived-1.0.0-mc1.21.11-${{ matrix.loader }}
          path: versions/1.21.11-${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.loader }}-${{ matrix.profile }}
          path: |
            versions/1.21.11-${{ matrix.loader }}/build/reports/tests/
            versions/1.21.11-${{ matrix.loader }}/build/test-results/
          if-no-files-found: ignore

  hidden-client:
    name: Hidden Fabric ${{ matrix.loader }} / ${{ matrix.optional }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { loader: '0.17.3', optional: without-optional-mods }
          - { loader: '0.20.1', optional: without-optional-mods }
          - { loader: '0.20.1', optional: with-optional-mods }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Start invisible client and verify loading
        shell: bash
        run: |
          chmod +x gradlew
          optional=()
          if [[ '${{ matrix.optional }}' == with-optional-mods ]]; then optional+=(-PwithOptionalMods); fi
          set -o pipefail
          xvfb-run -a ./gradlew :1.21.11-fabric:runSmokeClient --console=plain '-Pfabric_loader_version=${{ matrix.loader }}' "${optional[@]}" | tee client-smoke.log
          grep -q 'REVIVED_CLIENT_SMOKE_PASSED' client-smoke.log
      - name: Upload client diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hidden-client-${{ matrix.loader }}-${{ matrix.optional }}
          path: |
            client-smoke.log
            run/smoke-fabric/logs/
          if-no-files-found: ignore

  server-scenarios:
    name: Real server scenarios (Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Play the gameplay scenarios on a dedicated server
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :1.21.11-fabric:runSmokeServer --console=plain | tee server-smoke.log
          grep -q 'REVIVED_SERVER_SMOKE_PASSED' server-smoke.log
      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-scenarios
          path: |
            server-smoke.log
            run/smoke-fabric-server/logs/
            run/smoke-fabric-server/crash-reports/
          if-no-files-found: ignore

  client-screenshots:
    name: Real client rendering (Fabric)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Best effort. On 2 November 2026 GitHub's shared runners stopped loading this software-rendered client's world in
    # time, for every commit including one that had passed that morning ("Timeout loading world"), while the scenarios
    # themselves pass on a real machine. The unit tests, the dedicated-server scenarios and the hidden-client jobs stay
    # mandatory; this one keeps uploading screenshots whenever the runner cooperates.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Photograph every chest type on a cat and a wolf, sitting and baby pets, a golem visit and the remove-chest button
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          # A shared runner is sometimes too slow for the software-rendered client to load its world in time.
          for attempt in 1 2; do
            rm -rf run/smoke-screens/screenshots
            if xvfb-run -a ./gradlew :1.21.11-fabric:runSmokeScreens -PwithGameTest --console=plain | tee -a screenshots.log; then break; fi
            echo "Attempt $attempt failed"
          done
          test "$(ls run/smoke-screens/screenshots/*.png | wc -l)" -eq 61
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-screenshots
          path: |
            run/smoke-screens/screenshots/
            run/smoke-screens/logs/
            screenshots.log
          if-no-files-found: ignore

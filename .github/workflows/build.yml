name: Build and tests

# Every supported Minecraft version is built and played on every loader. A push to a branch with an open pull request is
# tested through the pull request only, so it is not tested twice.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.mc }} ${{ matrix.loader }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.11', '1.21.10', '1.21.9']
        loader: [fabric, neoforge, forge]
        profile: [minimum, current]
    steps:
      - uses: actions/checkout@v7
      - name: Install game JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and run unit tests
        shell: bash
        run: |
          chmod +x gradlew
          # -Pminimum builds against the oldest loader this version declares (see the version's gradle.properties).
          overrides=()
          if [[ '${{ matrix.profile }}' == minimum ]]; then overrides+=(-Pminimum); fi
          ./gradlew ':${{ matrix.mc }}-${{ matrix.loader }}:build' --stacktrace --console=plain \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 "${overrides[@]}"
          python3 scripts/verify_artifact.py '${{ matrix.loader }}' '${{ matrix.mc }}'
      # More Chest Variants' build for 1.21.9 and 1.21.10 requires NeoForge 21.10.63 or newer, so it cannot load on 1.21.9.
      - name: Verify NeoForge with More Chest Variants
        if: matrix.loader == 'neoforge' && matrix.profile == 'current' && matrix.mc != '1.21.9'
        run: ./gradlew :${{ matrix.mc }}-neoforge:test -PwithOptionalMods --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Start real Forge GameTest server
        if: matrix.loader == 'forge' && matrix.profile == 'current'
        run: ./gradlew :${{ matrix.mc }}-forge:runGameTestServer --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
      - name: Upload installable JAR and sources
        if: matrix.profile == 'current'
        uses: actions/upload-artifact@v7
        with:
          name: Chested-Companions-Revived-1.0.0-mc${{ matrix.mc }}-${{ matrix.loader }}
          path: versions/${{ matrix.mc }}-${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.mc }}-${{ matrix.loader }}-${{ matrix.profile }}
          path: |
            versions/${{ matrix.mc }}-${{ matrix.loader }}/build/reports/tests/
            versions/${{ matrix.mc }}-${{ matrix.loader }}/build/test-results/
          if-no-files-found: ignore

  hidden-client:
    name: Hidden Fabric ${{ matrix.mc }} ${{ matrix.loader }} / ${{ matrix.optional }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.11', loader: '0.17.3', optional: without-optional-mods }
          - { mc: '1.21.11', loader: '0.20.1', optional: without-optional-mods }
          - { mc: '1.21.11', loader: '0.20.1', optional: with-optional-mods }
          - { mc: '1.21.10', loader: '0.17.3', optional: without-optional-mods }
          - { mc: '1.21.10', loader: '0.20.1', optional: without-optional-mods }
          - { mc: '1.21.10', loader: '0.20.1', optional: with-optional-mods }
          - { mc: '1.21.9', loader: '0.17.3', optional: without-optional-mods }
          - { mc: '1.21.9', loader: '0.20.1', optional: without-optional-mods }
          - { mc: '1.21.9', loader: '0.20.1', optional: with-optional-mods }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Start invisible client and verify loading
        shell: bash
        run: |
          chmod +x gradlew
          optional=()
          if [[ '${{ matrix.optional }}' == with-optional-mods ]]; then optional+=(-PwithOptionalMods); fi
          set -o pipefail
          xvfb-run -a ./gradlew :${{ matrix.mc }}-fabric:runSmokeClient --console=plain '-Pfabric_loader_version=${{ matrix.loader }}' "${optional[@]}" | tee client-smoke.log
          grep -q 'REVIVED_CLIENT_SMOKE_PASSED' client-smoke.log
      - name: Upload client diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hidden-client-${{ matrix.mc }}-${{ matrix.loader }}-${{ matrix.optional }}
          path: |
            client-smoke.log
            run/smoke-fabric/logs/
          if-no-files-found: ignore

  server-scenarios:
    name: Real server scenarios (Fabric ${{ matrix.mc }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.11', '1.21.10', '1.21.9']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Play the gameplay scenarios on a dedicated server
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :${{ matrix.mc }}-fabric:runSmokeServer --console=plain | tee server-smoke.log
          grep -q 'REVIVED_SERVER_SMOKE_PASSED' server-smoke.log
      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-scenarios-${{ matrix.mc }}
          path: |
            server-smoke.log
            run/smoke-fabric-server/logs/
            run/smoke-fabric-server/crash-reports/
          if-no-files-found: ignore

  client-screenshots:
    name: Real client rendering (Fabric ${{ matrix.mc }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.21.11', '1.21.10', '1.21.9']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Photograph every chest type on a cat and a wolf, sitting and baby pets, a golem visit and the remove-chest button
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          echo "Runner: $(nproc) CPUs, $(free -m | awk '/Mem:/ {print $2}') MB RAM, load $(cut -d' ' -f1-3 /proc/loadavg)"
          # On 2 November 2026 GitHub's shared runners stopped loading this software-rendered client's world in time
          # ("Timeout loading world"), for every commit including one that had passed that morning, while the scenarios
          # pass on a real machine. That alone only raises a warning; any other failure still fails the job.
          played=
          for attempt in 1 2; do
            rm -rf run/smoke-screens/screenshots
            if xvfb-run -a ./gradlew :${{ matrix.mc }}-fabric:runSmokeScreens -PwithGameTest --console=plain | tee -a screenshots.log; then played=yes; break; fi
            echo "Attempt $attempt failed"
          done
          if [ -z "$played" ]; then
            if grep -q "Timeout loading world" screenshots.log && ! grep -q "REVIVED_CLIENT_SCREENSHOTS_FAILED" screenshots.log; then
              echo "::warning title=Real client scenarios not played::The runner could not load the world in time (Timeout loading world)."
              exit 0
            fi
            exit 1
          fi
          test "$(ls run/smoke-screens/screenshots/*.png | wc -l)" -eq 61
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-screenshots-${{ matrix.mc }}
          path: |
            run/smoke-screens/screenshots/
            run/smoke-screens/logs/
            screenshots.log
          if-no-files-found: ignore

plugins { id 'net.minecraftforge.gradle' version '7.0.40' }
apply from: rootProject.file('build-common.gradle')
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            mods { register('chestedcompanions_revived') { source sourceSets.main } }
            args '--mixin', 'chestedcompanions.mixins.json'
        }
        register('client') { workingDir = rootProject.layout.projectDirectory.dir('run/forge') }
        register('server') { workingDir = rootProject.layout.projectDirectory.dir('run/forge-server'); args '--nogui' }
        register('gameTestServer') { workingDir = rootProject.layout.projectDirectory.dir('run/forge-gametest') }
    }
}
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven }
// -Pminimum builds against the oldest Forge the mod declares, to prove the declared minimum.
def forgeVersion = project.hasProperty('minimum') ? forge_minimum : forge_version
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forgeVersion}")
    // Cloth no longer publishes Forge builds. Compile its shared API only;
    // the native settings screen remains available without installing Cloth.
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
}
jar { manifest.attributes('MixinConfigs': 'chestedcompanions.mixins.json') }
